name: Native deployment checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Version for native Linux/Mac archives (normal CI by default)'
        required: false
        default: ci
      macos_release_version:
        description: 'Mac release version, e.g. v0.1.0-preview.2; leave empty for normal CI'
        required: false
        default: ''
      sign_macos_release:
        description: 'Optional Developer ID signing/notarization; leave off for the free unsigned preview'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax with system Bash
        run: |
          for script in setup.sh scripts/*.sh Start.command Stop.command Start.sh Stop.sh; do
            /bin/bash -n "$script"
          done
      - name: Test downloads and launcher lifecycle with system Bash
        env:
          TEST_BASH: /bin/bash
        run: python3 -m unittest discover -s tests -v
      - name: Check download page behavior
        run: node --test tests/test_*.cjs
  native:
    needs: scripts
    if: github.event_name != 'workflow_dispatch' || inputs.macos_release_version == ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      JOBS: '2'
      PACKAGE_VERSION: ${{ inputs.package_version || 'ci' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable CPU runtime
        run: scripts/setup_llamacpp.sh --cpu --portable
      - name: Build portable Metal runtime
        if: runner.os == 'macOS'
        run: scripts/setup_llamacpp.sh --metal --portable
      - name: Package and verify relocated binaries
        run: scripts/package_release.sh --version "$PACKAGE_VERSION"
      - name: Extract delivered package for runtime checks
        run: |
          mkdir -p "$RUNNER_TEMP/apertus-delivered"
          if [[ "$RUNNER_OS" == macOS ]]; then
            ditto -x -k "dist/apertus-local-$PACKAGE_VERSION-macos-arm64.zip" "$RUNNER_TEMP/apertus-delivered"
            echo "PACKAGED_ROOT=$RUNNER_TEMP/apertus-delivered/Apertus Local.app/Contents/Resources/apertus-local" >> "$GITHUB_ENV"
          else
            tar -xzf "dist/apertus-local-$PACKAGE_VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/apertus-delivered"
            echo "PACKAGED_ROOT=$RUNNER_TEMP/apertus-delivered/apertus-local-$PACKAGE_VERSION-linux-x86_64" >> "$GITHUB_ENV"
          fi
      - name: Download exact Apertus model
        run: scripts/get_model.sh --apertus
      - name: Smoke-test actual Apertus on each available backend
        if: runner.os == 'macOS'
        run: /bin/bash tests/native_smoke.sh
      - name: Verify actual Apertus and browser UI with external networking blocked
        if: runner.os == 'Linux'
        run: sudo --preserve-env=PACKAGED_ROOT unshare --net /bin/bash tests/offline_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/
            .apertus-state/*.log
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
  linux_compatibility:
    needs: native
    if: github.event_name != 'workflow_dispatch' || inputs.macos_release_version == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12-slim']
    env:
      PACKAGE_VERSION: ${{ inputs.package_version || 'ci' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-Linux-X64
          path: .compat-artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the exact Linux archive and model
        run: |
          mkdir -p dist/compat-runtime
          archive="$(find .compat-artifact -name "apertus-local-$PACKAGE_VERSION-linux-x86_64.tar.gz" -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" -C dist/compat-runtime
          scripts/get_model.sh --apertus
      - name: Prepare consumer distribution without a compiler
        run: |
          docker build -t "apertus-compat:$GITHUB_RUN_ID" --build-arg 'BASE=${{ matrix.image }}' - <<'DOCKER'
          ARG BASE
          FROM ${BASE}
          RUN apt-get update && apt-get install -y --no-install-recommends bash python3 curl ca-certificates gawk libstdc++6 && rm -rf /var/lib/apt/lists/*
          DOCKER
      - name: Run the delivered archive with networking disabled
        run: |
          docker run --rm --network none -v "$PWD:/src" -w /src \
            -e "PACKAGED_ROOT=/src/dist/compat-runtime/apertus-local-$PACKAGE_VERSION-linux-x86_64" \
            -e 'HARDWARE_KIND=GitHub-hosted VM container ${{ matrix.image }} (NOT laptop)' \
            "apertus-compat:$GITHUB_RUN_ID" /bin/bash tests/native_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ strategy.job-index }}
          path: |
            dist/validation-*.json
            dist/launcher-*.log
            .apertus-state/*.log
          include-hidden-files: true
          retention-days: 7
  macos_release:
    needs: scripts
    if: github.event_name == 'workflow_dispatch' && inputs.macos_release_version != ''
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      JOBS: '2'
      RELEASE_VERSION: ${{ inputs.macos_release_version }}
      MACOSX_DEPLOYMENT_TARGET: '13.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify versioned Mac archive
        env:
          SIGN_RELEASE: ${{ inputs.sign_macos_release }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          arguments=(--version "$RELEASE_VERSION")
          if [[ "$SIGN_RELEASE" == true ]]; then arguments+=(--sign); fi
          /bin/bash scripts/release_macos.sh "${arguments[@]}"
      - name: Download exact model for delivered-runtime check
        run: scripts/get_model.sh --apertus
      - name: Verify actual inference from delivered app
        run: |
          archive="dist/release/apertus-local-$RELEASE_VERSION-macos-arm64.zip"
          ditto -x -k "$archive" "$RUNNER_TEMP/release-check"
          export PACKAGED_ROOT="$RUNNER_TEMP/release-check/Apertus Local.app/Contents/Resources/apertus-local"
          /bin/bash tests/native_smoke.sh
          codesign --verify --deep --strict "$RUNNER_TEMP/release-check/Apertus Local.app"
      - name: Retain archive, checksums and inference reports
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ inputs.macos_release_version }}
          path: |
            dist/release/
            dist/validation-*.json
            dist/launcher-*.log
          retention-days: 14
          if-no-files-found: error
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_RELEASE: ${{ inputs.sign_macos_release }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'error: release already exists; choose an unused version' >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/mac-release-notes.md" <<'NOTES'
          Apple Silicon macOS 15+ preview of Apertus Local. The app includes portable CPU and Metal runtimes; no Apple Developer membership, compiler, Homebrew or Python installation is needed by participants.

          Unzip and open Apertus Local.app. Allow Terminal access when asked. The launcher downloads and verifies the 5.3 GiB model once, then opens local chat. Keep Terminal open; Control+C stops the model. CPU is the default; 16 GB RAM is recommended.

          Hosted-runner inference checks use CPU and partial Metal. The source setup and offline chat passed on a physical Mac according to the project owner. The packaged app's browser-download/Finder opening rehearsal is still pending; this release is a preview. Formal laptop performance measurements can follow separately.
          NOTES
          if [[ "$SIGN_RELEASE" == true ]]; then
            echo 'This app is Developer ID signed, notarized and stapled.' >> "$RUNNER_TEMP/mac-release-notes.md"
          else
            cat >> "$RUNNER_TEMP/mac-release-notes.md" <<'NOTES'

          This preview has an ad-hoc code seal, without an Apple-verified publisher or notarization. After trying to open the app, macOS may require System Settings > Privacy & Security > Open Anyway, followed by confirmation. Approve only the app you intentionally downloaded from this release. Do not disable system-wide security checks. If a managed Mac does not offer approval, contact its administrator.

          Read MACOS_FIRST_START.txt inside the ZIP, or https://support.apple.com/en-us/102445. Signing remains an optional future distribution improvement.
          NOTES
          fi
          archive="dist/release/apertus-local-$RELEASE_VERSION-macos-arm64.zip"
          gh release create "$RELEASE_VERSION" "$archive" "$archive.sha256" \
            --draft --prerelease --target "$GITHUB_SHA" \
            --title "Apertus Local $RELEASE_VERSION — Apple Silicon preview" \
            --notes-file "$RUNNER_TEMP/mac-release-notes.md"
